name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/e2e-cross-browser.yml

  images:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (immutable digests recorded in the release notes)
        id: push
        run: |
          echo "## Images" > digests.md
          for s in api worker web; do
            ref=ghcr.io/${{ github.repository }}/$s:${GITHUB_REF_NAME}
            docker buildx build --push --provenance=true --sbom=true -f docker/$s.Dockerfile -t $ref .
            digest=$(docker buildx imagetools inspect $ref --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "- \`$s\`: \`${ref}@${digest}\`" >> digests.md
          done
      - uses: softprops/action-gh-release@v2
        with:
          body_path: digests.md
