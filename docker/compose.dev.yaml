# Development / local evaluation overrides:
#   pnpm infra:up   (= docker compose --env-file .env -f docker/compose.yaml -f docker/compose.dev.yaml --profile local-db --profile dev-mail up -d --wait postgres mailpit)
# - edge proxy always on at http://localhost:8080 (single origin for web + /api)
# - Mailpit UI at http://localhost:8025, PostgreSQL at localhost:5432
# - local database URLs point to the compose services
x-dev-env: &dev-env
  DATABASE_URL: postgres://${POSTGRES_APP_USER:-starter_app}:${POSTGRES_APP_PASSWORD:-starter_app}@postgres:5432/${POSTGRES_DB:-starter}
  DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starter}
  SMTP_URL: smtp://mailpit:1025
  APP_URL: ${APP_URL:-http://localhost:8080}
  STORAGE_LOCAL_DIR: /data/storage
  NUXT_API_INTERNAL_URL: http://api:3001

services:
  postgres:
    environment:
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-starter_app}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
  mailpit:
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      # SMTP for apps running on the host (pnpm dev): SMTP_URL=smtp://localhost:1025
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
  migrate:
    environment: *dev-env
  api:
    environment: *dev-env
  worker:
    environment: *dev-env
  web:
    environment: *dev-env
  proxy:
    profiles: !reset []
    ports:
      - '127.0.0.1:${PROXY_PORT:-8080}:8080'

  # Test double of the external retrieval API contract (docs/rag-external.md) plus a tiny static
  # site for URL/sitemap ingestion. Development and E2E only; it refuses NODE_ENV=production.
  retrieval-test:
    profiles: [rag-db]
    image: ${STARTER_IMAGE_PREFIX:-starter}/api:${STARTER_VERSION:-local}
    command: ['node', 'dist/scripts/retrieval-test-server.js']
    environment:
      NODE_ENV: test
      RETRIEVAL_TEST_PORT: '3005'
      RETRIEVAL_TEST_TOKEN: ${RETRIEVAL_TEST_TOKEN:-}
    # The api image's own healthcheck probes the API port; this service listens on 3005.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3005/site/faq.html').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
