<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">Starter Kit Nuxt + NestJS + IA</title>
<desc id="desc">Base de producción para aplicaciones internas con acceso por código, permisos, IA con costos, agentes con chat, conocimiento y correo. A la derecha, una terminal reproduce la instalación en un comando con node scripts/quickstart.mjs.</desc>
