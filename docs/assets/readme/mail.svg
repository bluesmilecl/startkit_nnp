<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">Correo y automatizaciones</title>
<desc id="desc">Una acción auditada, como crear un proyecto, activa una automatización que revisa los eventos cada minuto sin duplicados, deja una fila en Envíos y la envía con el trabajo durable mail.send usando la plantilla con variables y marca, por Resend, SMTP, Postmark u otro proveedor. Los correos del sistema (código, invitación, alertas) usan las mismas plantillas y quedan en el mismo registro.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111827"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<marker id="a-web" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#00dc82"/></marker><marker id="a-api" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f43f5e"/></marker><marker id="a-worker" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fbbf24"/></marker><marker id="a-pg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#60a5fa"/></marker><marker id="a-ai" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a78bfa"/></marker><marker id="a-rag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker><marker id="a-mail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f472b6"/></marker><marker id="a-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cbd5e1"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#34d399"/></marker><marker id="a-err" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><marker id="a-ui" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#38bdf8"/></marker>

</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#e5e7eb}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.t{font-size:20px;font-weight:700;fill:#f8fafc}
.st{font-size:13px;fill:#94a3b8}
.h{font-size:14px;font-weight:600;fill:#f1f5f9}
.m{font-size:12px;fill:#94a3b8}
.k{font-size:11px;font-weight:600;letter-spacing:1.6px}
.lbl{font-size:11px;fill:#cbd5e1}
.base{fill:none;stroke-width:1.6;stroke-opacity:.4}
.flow{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 9;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18.2}}
.glow{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.flow,.glow,.pulse{animation:none}}
</style>
<rect width="960" height="360" rx="18" fill="url(#bg)"/>
<rect width="960" height="360" rx="18" fill="url(#grid)"/>
<rect x=".75" y=".75" width="958.5" height="358.5" rx="17.25" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="28" y="52" style="font-size:15px;font-weight:600;fill:#e2e8f0">Proveedor, plantillas y reglas se configuran en el panel; los envíos de automatizaciones son trabajos durables</text>
