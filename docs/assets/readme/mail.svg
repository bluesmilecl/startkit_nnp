<g opacity="0"><circle r="9.4" fill="#38bdf8" fill-opacity=".18"/><circle r="3.6" fill="#38bdf8"/><animateMotion dur="6.5s" begin="-3s" repeatCount="indefinite" path="M106 288 H850 V144"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="6.5s" begin="-3s" repeatCount="indefinite"/></g>
