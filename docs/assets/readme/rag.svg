<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="title desc">
<title id="title">Conocimiento (RAG): ingesta y consulta</title>
<desc id="desc">Ingesta en el worker: la fuente (archivo, URL, sitemap o texto) se descarga con safeFetch, se divide en fragmentos, se calculan embeddings con costo medido y se guarda en pgvector, un PostgreSQL externo o una API. Consulta: la pregunta se filtra por permisos de colección y documento, se busca de forma híbrida (vector y texto con RRF), el contexto se trata como datos y la respuesta cita sus fuentes.</desc>
<defs>
